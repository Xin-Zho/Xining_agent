<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>XinAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css?v=2">
</head>
<body>

<div id="app">
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <button onclick="App.newConversation()">+ 新建对话</button>
    </div>
    <div class="sidebar-body">
      <div class="sidebar-section">
        <div class="sidebar-section-title">对话</div>
        <div id="convList"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-title">Agent</div>
        <div class="agent-item" onclick="App.selectAgent(null)" data-agent-id="">
          <span>🤖</span> <span class="title">默认助手</span>
        </div>
        <div id="agentList"></div>
        <div class="agent-item" onclick="App.openAgentModal()" style="color:var(--accent)">
          <span>＋</span> <span class="title">创建 Agent</span>
        </div>
      </div>
    </div>
    <div class="sidebar-footer">
      <span id="sidebarUser">用户</span>
      <select onchange="App.onModelChange()" id="modelSelect" title="模型选择">
        <option value="chat">⚡ 快速</option>
        <option value="reasoner">🧠 深度</option>
      </select>
      <select onchange="App.onFontSizeChange()" id="fontSizeSelect" title="字体大小">
        <option value="normal">A</option>
        <option value="large">A+</option>
      </select>
      <button class="eval-link" onclick="Eval.open()">📊</button>
      <button class="logout-btn" onclick="Auth.logout()">退出</button>
    </div>
  </nav>

  <!-- Overlay -->
  <div id="overlay" onclick="App.closeSidebar()"></div>

  <!-- Main -->
  <div id="main">
    <!-- Header -->
    <div id="header">
      <button class="hamburger" onclick="App.toggleSidebar()">☰</button>
      <span class="title">Xin</span>
      <span class="badge active" id="agentBadge" style="display:none">Agent</span>
      <span class="badge" id="modelBadge" style="display:none">快速</span>
      <span id="headerSub" style="font-size:12px;color:var(--slate-5)"></span>
      <select onchange="App.onAgentModeChange()" id="modeSelect" title="Agent 模式" style="margin-left:auto">
        <option value="react">Agent</option>
        <option value="plan_solve">专家</option>
        <option value="normal">对话</option>
      </select>
    </div>

    <!-- Messages -->
    <div id="messages">
      <div id="emptyState">
        <div class="icon">💬</div>
        <div>新建一个对话开始聊天</div>
      </div>
    </div>

    <!-- Input -->
    <div id="inputArea">
      <div id="tokenBar" style="display:none">
        <span>📊 <span id="tokenPct">0%</span></span>
        <div class="bar-bg"><div class="bar-fill" style="width:0%"></div></div>
        <span id="tokenDetail" style="font-size:11px"></span>
      </div>
      <div id="attachTags"></div>
      <div id="inputRow">
        <input type="file" id="fileInput" multiple hidden onchange="Chat.handleFileSelect(this.files)">
        <button onclick="document.getElementById('fileInput').click()" style="background:none;border:none;font-size:18px;cursor:pointer;padding:8px" title="上传文件">📎</button>
        <textarea id="msgInput" rows="1" placeholder="输入消息... (Shift+Enter 换行)" onkeydown="Chat.handleKeyDown(event)"></textarea>
        <button id="sendBtn" onclick="Chat.sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- Evaluation Page -->
  <div id="evalPage">
    <div class="eval-header">
      <button class="back-btn" onclick="Eval.close()">←</button>
      <h2>Agent 评估</h2>
    </div>
    <div class="eval-tabs">
      <button class="eval-tab active" onclick="Eval.switchTab('overview')">📈 总览</button>
      <button class="eval-tab" onclick="Eval.switchTab('weaknesses')">⚠️ 弱点</button>
      <button class="eval-tab" onclick="Eval.switchTab('recommendations')">💡 建议</button>
    </div>
    <div class="eval-body" id="evalOverview"></div>
    <div class="eval-body" id="evalWeaknesses" hidden></div>
    <div class="eval-body" id="evalRecommendations" hidden></div>
  </div>

  <!-- Auth Page -->
  <div id="authPage">
    <div class="auth-card">
      <h1 id="authTitle">登录</h1>
      <div class="sub" id="authSubtitle">欢迎回来</div>
      <label style="display:none" for="authUser">用户名</label>
      <input id="authUser" placeholder="用户名" title="用户名" autocomplete="username">
      <label style="display:none" for="authPass">密码</label>
      <input id="authPass" type="password" placeholder="密码" title="密码" autocomplete="current-password">
      <div id="authCodeLabel" style="display:none"><input id="authCode" placeholder="邀请码"></div>
      <button id="authBtn" onclick="Auth.handleAuth()"><span class="spinner"></span><span class="btn-text">登 录</span></button>
      <div id="authError"></div>
      <div style="margin-top:12px;font-size:13px">
        <span id="switchText">没有账号？</span>
        <span id="switchLink" onclick="Auth.toggleAuthMode()">注册</span>
      </div>
    </div>
  </div>
</div>

<!-- Agent Modal -->
<div class="modal-overlay" id="agentModalOverlay" onclick="if(event.target===this)App.closeAgentModal()">
  <div class="modal">
    <h3 id="agentModalTitle">创建 Agent</h3>
    <input id="agentName" placeholder="Agent 名称">
    <input id="agentDesc" placeholder="简短描述">
    <textarea id="agentPrompt" placeholder="System Prompt（告诉 Agent 如何表现）" rows="4"></textarea>
    <input id="agentEditId" hidden>
    <div class="actions">
      <button class="secondary-btn" onclick="App.closeAgentModal()">取消</button>
      <button class="primary-btn" onclick="App.saveAgent()">保存</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <h3>⚠️ 确认工具执行</h3>
    <div id="confirmToolName" style="font-weight:600"></div>
    <div class="tool-info" id="confirmArgs"></div>
    <div style="font-size:12px;color:var(--slate-5);margin-bottom:12px" id="confirmTimer">60s 后自动拒绝</div>
    <div class="actions">
      <button class="secondary-btn" onclick="Agent.confirmTool(false)">拒绝</button>
      <button class="primary-btn" onclick="Agent.confirmTool(true)">确认执行</button>
    </div>
  </div>
</div>

<!-- Changelog Toast -->
<div id="changelogToast">
  <button class="close" onclick="document.getElementById('changelogToast').classList.remove('show')">×</button>
  <div id="changelogContent"></div>
</div>

<script src="/static/js/utils.js?v=2"></script>
<script src="/static/js/auth.js?v=2"></script>
<script src="/static/js/chat.js?v=2"></script>
<script src="/static/js/agent.js?v=2"></script>
<script src="/static/js/eval.js?v=2"></script>
<script src="/static/js/app.js?v=2"></script>

</body>
</html>
